; BF1GameExt.ini   (v6.4 - Ben James: [Addons] added; [Sprint] TestBoost=0 and StaminaBar=0 - dinput8_bf1sprint.dll does sprint now.
; BF1GameExt's own files moved to GameData\BF1GameExt\: console.lvl, the .lua scripts, the logs, BF1GameExt_IAOptions.ini.
; This file stays next to Battlefront.exe.)
[Addons]
; 1 = load every GameData\dinput8_*.dll (name order) - Ben's mods: dinput8_bf1sprint, bf1combo, bf1cloth, bf1cpchange ...
; Each add-on has its own .ini next to the exe and puts its rows on OPTIONS > MODS. 0 = none loaded.
LoadAddons=1

; BF1GameExt.ini   (file build p21h-r4 - 4-PLAYER: Enabled=0, MainMenuSplit=1, SplitSignIn=1, SignIn4=1, TempProfiles=1, SideLock=1, GCTurnScan=1, Views=4, Players=4 - the sign-in picks 2 / 3 / 4; Galactic Conquest commanders; the galaxy turn scanner; 21h: players 3 / 4's real pause menus - RealPauseP34, PauseSoundP34, MenuBoxP2, PauseSoundsP2, OptionsP2, PopupScaleP34, OptionsScan34)
[Splitscreen]
; 1 = split screen on from the start (sticky, as F9): every mode is split, single player too. 0 = split screen comes on
; when you pick it (21e: the main menu's SPLIT SCREEN; F9 still works). With the SPLIT SCREEN menu, leave it 0.
Enabled=0
; 21e: 1 = SPLIT SCREEN is back in the main menu (the console's entry, under MULTIPLAYER). It turns split screen on and
; opens the console sign-in screen (see SplitSignIn); backing out to the main menu turns it off again. 0 = the main menu
; as the game has it.
MainMenuSplit=1
; 21e: 1 = SPLIT SCREEN opens the console sign-in screen: player 1 (keyboard / mouse / the game's pad) picks his profile
; and presses A (Enter) = READY; player 2 presses START (or A) on pad 2 to join, picks a profile (d-pad / left stick)
; and presses A = READY, B = back. With both READY, START (player 1: A / Enter too) goes on to the split screen game
; modes (Instant Action -> the map list -> the match). 0 = SPLIT SCREEN goes straight to the split screen game modes.
SplitSignIn=1
; 21g: 1 = with players 3 / 4 on (Players=3 / 4) the sign-in screen is Battlefront II's 4-player one (the Xbox's): four
; quarters split by the game's own grey line and a vertical one like it - player 1 top left, player 2 top right, player 3
; bottom left, player 4 bottom right (where they play). Each quarter: PRESS START BUTTON TO JOIN, the profile list (BACK /
; ACCEPT), the profile's name over READY. Players 3 and 4 join with START (or A) on pads 3 and 4 (the first two pads the
; game's pad and pad 2 are not using, as in the match); their profiles are names only (the game loads 2 profiles). START
; launches once players 1 and 2 are READY and everyone else who joined is READY too. With Players=3 the bottom right
; quarter stays empty. 0 = the 2-player sign-in. With Players=2 the 2-player sign-in always.
; 21g-r2: the match has as many players as signed in (Players / Views below are the most it can have): 2 = the 2-player
; split (Vertical as set, no quarters), 3 = the 3-player layout (player 3 in the bottom half), 4 = quarters. The pads that
; signed in are players 3 / 4's (player 4 alone plays as player 3). Until the first sign-in: Players.
SignIn4=1
; 21g-r2: 1 = PLAYER 2, PLAYER 3 and PLAYER 4 are in the sign-in list as temporary profiles (where no profile has that
; name): players 2 / 3 / 4 start on their own when they join, and they are never saved - they never show in the profile
; screen. A player with a profile of his own picks it instead. Player 1 signs in with a saved profile. Player 2's is made
; the way the game makes its own PLAYER 2 when there are not 2 profiles (a copy of player 1's settings, renamed). 0 = the
; saved profiles only (as 21g-r1).
TempProfiles=1
; 21f: 1 = no side screens while the game says sides cannot be switched - the campaign and Galactic Conquest (the shell
; turns "can switch sides" off for them, and Galactic Conquest's rules forbid it): players 1 and 2's spawn screens start at
; the spawn point screen on the side the game gave them, and B there does not go back to a side screen. Player 1's
; console spawn screens in 1-player games too. Instant Action keeps its side screens. 0 = the side screens always come up.
; 21g-r3: players 3 and 4 too - the campaign: player 1's side; Galactic Conquest: the side each picked on PICK YOUR SIDE.
SideLock=1
; 21g-r3: written by BF1GameExt - the last Galactic Conquest's picks with 3 / 4 players (each player's side, each side's
; commander), so a conquest saved and resumed in a later session keeps them. Leave it as it is.
GCLastPick=2 2 2 0 0 1
; 21g-r4: 1 = the galaxy turn scanner (log only): on Galactic Conquest's galaxy map in split screen (2, 3 or 4 players)
; [gcturn] lines in BF1GameExt_split.log - each turn (the page, the side choosing, who moves it: the player and his pad,
; or the AI), every choice and every press (whose, where it went, what the game made of it), the battle result and why
; the turn stays or passes (the game's rule: the attacker attacks again after a win), the game's script errors there,
; and a turn that stands still for 30 s. Nothing in the game changes. 0 = no [gcturn] lines.
GCTurnScan=1
AutoSpawnP2=1
Vertical=0
P2ThirdPerson=1
; 18u: 1 = player 2's menus (his pause menu) take pad 2: the interface's held-button table gets one slot per player
; (on PC it had one, and player 2's ran over the game's own data, so his menus never moved). 0 = the game's own code.
P2MenuInputFix=1
; 18u: 1 = player 2 gets his own spawn screens in his half in split screen, by themselves: choose your side, then the
; spawn point, then the class - pad 2 (d-pad / left stick, A, B). A on the class spawns him (20g-r6: at once - see
; SpawnWaitP1). AutoSpawnP2 stands aside while they run. 0 = no screens: AutoSpawnP2 spawns him as before.
P2SpawnScreen=1
; 18u: 1 = player 2's map in its spawn screen mode while his spawn point screen is up. 0 = his map as it is.
P2SpawnMap=1
; 18x: 1 = 3D soldiers on player 2's side screen and class screen (19g: his class screen's are a ring of his side's
; classes that turns, like player 1's). 0 = texts only.
P2SpawnSoldiers=1
; 19a: 1 = in split screen the pause menu's Respawn kills the player's soldier (he dies where he stands, then his spawn
; screen), as on the Xbox. 0 = the game's own: the soldier is removed without a death.
P2RespawnDies=1
; 19g: 1 = player 2's spawn screens get the blue grid room behind them, as player 1's have (a copy of the PC spawn
; screen's own grid, which the game makes for player 1 only). 0 = the game's world behind his screens.
P2SpawnBackdrop=1
; 19i: 1 = a spawn screen switch (player 2's screens; player 1's console screens) takes effect in the frame it is made
; (the IF manager's own tick is run right after the push / pop) and the new screen is set up before it is first drawn,
; so no frame shows a screen as the game left it. 0 = the switch waits for the IF update, as before 19i (one glitch frame).
SpawnScreenSwitchNow=1
; 20a: 1 = the 4-player map, log only: every 2-player limit of the game found and checked, a census of the calls
; into its per-player entry points (by caller and player), every per-player table 45 s and 3 min into a split
; screen match ([playerN] lines). Nothing in the game changes. 0 = none of it installed.
PlayerNScan=1
; 20b: 4 = the 4-player test views: the two players in the top quarters (player 1 left, player 2 right), views 3
; and 4 in the bottom quarters (spectators - player 1's / player 2's camera turned round, no HUD - until players
; 3 and 4 exist). Vertical is ignored with 4. 2 = none of the 4-player code installed: the 2-player split exactly
; as before. 20g-r13: 3 = the 3-player layout: players 1 and 2 in the top quarters (as with 4), player 3 in the full-width
; bottom half (player 2's half in the 2-player horizontal split, its camera shaped like it); no fourth view. Vertical is
; ignored with 3 too.
Views=4
; 20c-20e: 3 or 4 = players 3 (and 4) while split screen is on (needs Views=4): the game is told 3 / 4 local players
; and makes their characters; views 3 and 4 follow their soldiers; their pads, spawn screens and HUD below.
; 2 = none of it installed: 2 players exactly as before. 20g-r13: with Views=3, Players is 3 (4 is held to 3).
; 21g-r2: the most a match can have - the 4-player sign-in picks 2 to this many for each match (SignIn4).
Players=4
; 20d: 1 = players 3 and 4 are spawned automatically (their Spawn pressed every 3 s while player 1 is in the world
; and they are not), with their side's default class. 20f-r2: only for a player whose own spawn screens are not
; running (SpawnP34=0, or his pad not connected). 0 = they wait. Only used with Players=3 / 4.
AutoSpawnP34=1
; 20e: 1 = pads 3 and 4 drive players 3 and 4 (the first two XInput pads the game's pad and pad 2 are not using,
; lowest index first). 0 = players 3 and 4 copy pads 1 and 2 (the 20d test). Only used with Players=3 / 4.
PadsP34=1
; 20f-r2: 1 = players 3 and 4 get their own spawn screens in their quarters, by themselves: choose your side, then the
; spawn point, then the class (a ring of the side's soldiers) - their own pads (d-pad / left stick, A, B), as player
; 2's. A on the class spawns him (20g-r6: at once - see SpawnWaitP1). AutoSpawnP34 stands aside while they run. 0 = no
; screens: AutoSpawnP34 spawns them as before. Needs Players=3 / 4 and PadsP34=1.
SpawnP34=1
; 20g-r3: 1 = players 3 and 4 get their own HUD in their quarters: the game's own displays (health / ammo, minimap,
; reticule, team counts, capture timer, stat icons, the boot warning), two more of each, set up for
; them at each match start, hidden while their spawn screens are up. 0 = no HUD of their own (as 20f). Only used with
; Players=3 / 4 and Views=4.
HudP34=1
; 20g-r3: which of the displays above players 3 and 4 get (add the numbers): 1 = Boot (the boot warning),
; 2 = Capture (capture timer), 4 = Map (minimap), 8 = Reticule, 16 = Scope (20g-r7: the zoom scope, see ScopeP34),
; 32 = StatIcon, 64 = Status (health / ammo), 128 = Team (team counts). 255 = all of them.
HudP34Mask=255
; 20g-r6: 0 = players 2, 3 and 4 spawn the moment they press A on their class screen, whether player 1 is in the
; world or not. 1 = the old rule: they wait for player 1 ("WAITING FOR PLAYER 1").
SpawnWaitP1=0
; 20g-r6: while player 1 is on his spawn screens the game draws every soldier in low detail (the low-res models) - in
; every view. 1 = only in player 1's own view (players 2-4 keep full detail), with players 3 / 4 on. 2 = the same in
; 2-player split screen too (and with 3 / 4 players). 0 = as the game does it. (Needs PlayerNScan=1 or Views=4.)
SpawnLodP1Only=2
; 20g-r6: 1 = players 3 and 4 get the game's death camera when they die. 0 = their camera stops where it was. Only used
; with Players=3 / 4.
DeathCamP34=1
; 20g-r7: 1 = players 2, 3 and 4's death cameras hold a still picture once DeathCamStillMs have passed after the death
; (the game's death camera turns to the killer at 1.5 s - they would not see him). 20g-r10: 0 = as the game does it, as
; player 1's: they see their killer until their spawn screen comes up (the default now). 4-player only.
DeathCamStill=0
; 20g-r7: with DeathCamStill=1, how long the death camera moves before it holds (milliseconds, 0 - 10000; 0 = still from
; the first frame; 1500 = right before it turns to the killer). 20g-r10: no longer when they cut to the camera shot.
DeathCamStillMs=1500
; 20g-r9: 1 = players 2, 3 and 4 show player 1's camera shot (the level's AddCameraShot view player 1 gets on his spawn
; screens) while they have no soldier. 20g-r10: from the frame their spawn screen comes up (their respawn timer runs out,
; 4 s after the death - the moment player 1's spawn screen opens and his camera goes to the shot), and before their
; first spawn; until then their death camera. The shot follows player 1's (each time his spawn screen picks one).
; 4-player only. 0 = their death camera until they spawn.
CamShotP234=1
; 20g-r6: 1 = players 3 and 4's spawn point screen shows their map (the command posts, the chosen one lit up) in the
; left of their quarter, the spawn point's name beside it. Needs P2SpawnMap=1 and HudP34=1 (their own minimap).
; 0 = texts only.
SpawnMapP34=1
; 20g-r6: 1 = Start on pad 3 / 4 opens that player's own pause screen in his quarter. 20g-r7: as the game's pause menu -
; GAME PAUSED: RESUME GAME, OPTIONS (20g-r8: his CONTROLLER page, below), RESPAWN, RESTART MISSION and QUIT (both ask
; "A YES / B NO" first), "B BACK" - over his own view (up / down, A; B or Start = back). His soldier stands still while
; it is up. 0 = Start does nothing for them. 21h-r2: with RealPauseP34=1 (below) it is the game's own kind of pause menu.
PauseP34=1
; 20g-r9: 1 = their pause screen in the game's look: copies of player 2's pause menu bars (the orange GAME PAUSED bar,
; the blue item bars) at their places. If the game's bars cannot be copied: the texts on the blue grid. 0 = r8's texts.
PauseLookP34=1
; 20g-r9: 1 = the game's sound is faded out while player 3's / 4's pause screen holds the game paused (as the game's own
; pause does) and back in after. 0 = the sound plays on. 21h-r3: the fade only goes through with PauseSoundP34=1 (below).
PauseMuteP34=1
; 20g-r8: players 3 and 4's controller options - their pause screen's OPTIONS page (CONTROLLER) changes these and saves
; them here (up / down picks, left / right or A changes, B back). InvertLook: 1 = up / down look inverted on foot and in
; ground vehicles. InvertFlying: 1 = inverted while flying (the game's default for player 1 too). Sensitivity: look
; speed 1 - 10, 5 = the game's normal (1 = about half as fast, 10 = twice as fast).
InvertLookP3=0
InvertFlyingP3=1
SensitivityP3=3
InvertLookP4=0
InvertFlyingP4=0
SensitivityP4=5
; 20g-r7: 1 = the game pauses while player 3's / 4's pause screen is up, as it does for players 1 and 2's (offline).
; 0 = the game runs on behind it (as 20g-r6).
PauseWorldP34=1
; 21h-r1: 1 = the pause scan (log only): [pause34] lines - how the game's pause reaches each player's menus and where each
; pause screen is drawn. Nothing in the game changes. 0 = no [pause34] lines.
PauseScan34=1
; 21h-r2: 1 = players 3 and 4's pause screens are the game's own kind (ifs_pausemenu3 / 4 in their quarters, made by the
; game's script functions as player 2's, BF1GameExt_pause34.lua): RESUME GAME, OPTIONS, RESPAWN, RESTART MISSION, QUIT.
; 21h-r3: OPTIONS -> GAME OPTIONS (difficulty) / CONTROL OPTIONS (invert look / flying, sensitivity), as player 1's;
; RESPAWN / RESTART MISSION / QUIT ask in a popup window like player 1's (A = yes, B = no); B goes back a step. Leaving the
; menu never crouches / jumps them (their soldier gets no buttons until every button is let go). Needs PauseWorldP34=1.
; 0 = BF1GameExt's own pause screen (20g-r9's look). [rp34] lines.
RealPauseP34=1
; 21h-r3: 1 = while player 3's / 4's pause menu holds the game, the game's sound keeps running as in player 1's pause
; (the game fades out and goes silent, the menu clicks play). 0 = as r2 (the sound stands still, the game stays loud).
PauseSoundP34=1
; 21h-r3: 1 = 3 / 4 players: player 2's "are you sure" popups and option screens are drawn in his quarter (top right).
; 0 = as before (in another quarter). 2-player is never changed.
MenuBoxP2=1
; 21h-r3: 1 = 3 / 4 players: player 2's pause menu plays player 1's accept / back sounds. 0 = as the game has it (none).
PauseSoundsP2=1
; 21h-r4: 1 = 3 / 4 players: player 2's OPTIONS are gamepad only - no VIDEO OPTIONS, and CONTROL OPTIONS opens the gamepad
; page at once (no keyboard page). Player 1 keeps video, audio and the keyboard page. 0 = player 2's OPTIONS as the game has them.
OptionsP2=1
; 21h-r4: the size of players 3 / 4's "are you sure" (YES / NO) window, in percent of the game's own numbers. 51 = the size
; player 1's window has on screen (his is drawn in the interface root, theirs in their quarter's root - twice as coarse).
PopupScaleP34=51
; 21h-r4: 1 = the options pages scan (log only): [optscan] lines - the game's GAME OPTIONS and gamepad pages as the game
; builds them (for the copies in players 3 / 4's quarters next); [ctlmap] lines - each player's button map when player 3's /
; 4's pause menu opens. Nothing in the game changes. 0 = no [optscan] lines.
OptionsScan34=1
; 20g-r6: 1 = players 3 and 4 get ears of their own: the sound engine has 4 listener slots and plays every sound for
; the nearest listener, but only players 1 and 2's cameras had one - so everything near players 3 and 4 sounded as far
; away as it was from players 1 / 2. Now views 3 and 4 get a listener each, as players 1 and 2's. 0 = off.
SoundP34=1
; 20g-r7: 1 = players 3 and 4's cameras keep their own distance from walls. The game eases the third-person camera's
; wall distance in one place per camera of its own, and players 3 / 4's cameras used player 1's - when player 1 backed
; into a wall, their cameras went in too. 0 = as before.
WallCamP34=1
; 20g-r7: 1 = players 3 and 4 get the red damage tint when they are shot (a record of their own in the game's screen
; filter, drawn in their views). 0 = no tint for them.
TintP34=1
; 20g-r7: 1 = command post lights in the colour of each view's own team (players 3 and 4 saw players 1 / 2's lights,
; red at their own posts). 0 = as the game does it.
CpLightsP34=1
; 20g-r7: 1 = players 3 and 4 get zoom scopes of their own (the scope display and its blur in their quarters; until now
; their zoom showed player 1's / 2's scope in players 1 / 2's views). Needs HudP34=1 and HudP34Mask with 16. 0 = none.
; (20g-r9: r7 / r8 never made it - fixed.)
ScopeP34=1
; 20g-r9: 1 = objects near players 3 and 4 collide (the game only collides objects within 60 m of players 1 / 2's
; cameras, so players 3 / 4 far from them walked through vehicles and AI soldiers). 0 = as the game has it.
CollisionP34=1
; 20g-r7: 1 = with 4 players, players 1 and 2's side, spawn point and class screens take players 3 and 4's places and
; sizes in their quarters (player 2's screens use players 3 / 4's layout, player 1's side soldiers and class ring are
; at players 3 / 4's sizes). 0 = the 2-player split look. (Player 1's menus are drawn in his own quarter either way -
; 20g-r7 fixed their box, which was the left half's, half of it in player 3's quarter.) 20g-r9: every quarter's class
; ring is laid out like Battlefront II's 4-player wheel (twice as wide, the picked soldier in the middle). 20g-r10:
; players 1 and 2's side screens are drawn exactly as players 3 / 4's (the same group in their HUD root, the same grid,
; title, soldiers, names and SELECT SIDE at the same places).
MenusLikeP34=1
; 20g-r12: 1 = in the horizontal split (Vertical=0, 2 players) both players' side, spawn point and class screens are laid
; out as the Classic Collection's horizontal split: the game's own (turned) panels, class window and "B BACK" where the
; game puts them, the side screen's soldiers and names, the class ring (the picked soldier in front in the middle), the
; prompts and the spawn point map at Classic's places and sizes - both halves alike. 0 = the vertical split's layout in the
; horizontal split too (as r11). Nothing changes in the vertical split or with 4 players. 20g-r13: with Views=3 player 3's
; screens in his bottom half take the same places (player 2's horizontal ones); 0 = players 3 / 4's quarter places.
MenusHorizontal=1
; 20g-r12: 1 = in the horizontal split (with MenusHorizontal=1) each half's HUD gets the Classic Collection's margins: 10% at
; the top and the bottom of the half (the game gives player 1's half 10% / 2% and player 2's 2% / 10% - his score bar sat
; on the split line). Both players' HUD and menus then stand alike, where Classic has them. 0 = the game's margins.
; 20g-r13: with Views=3 player 3's bottom half gets the same margins (his HUD as player 2's in the horizontal split).
HorizontalSafeArea=1

