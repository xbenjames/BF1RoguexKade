[Limits]
; BF1MemExt's memory limits on GOG 1.3 and Steam (on 1.2, BF1MemExt.dll itself does this). 1 = raised, 0 = the
; game's own. Read at game start. Each line is checked against the game's code before anything is written.
; Main heap 64 -> 128 MB, debug heap 2 -> 4 MB, application heap 15.25 -> 20 MB.
Heaps=1
; Soldier animators 10 -> 100 (soldiers animated in full detail), the render pools sized with them, pool minimum
; 80 -> 124.
HiResUnits=1
; Matrix pool 3062 -> 50000 (BF1MemExt: stops sliding animations).
MatrixPool=1
; DLC / addon missions 512 -> 4096.
DLCMissions=1

[Ragdoll]
; 1 = soldiers who die or are thrown on terrain near a player fall as ragdolls (Bullet physics). 0 = the game's animations.
; Changed while playing: 0 ends running ragdolls at once, 1 brings them back (only if it was 1 at game start).
Enabled=1
; Ragdolls only within this many metres of a local player's soldier (20g-r6: players 3 and 4 count too; 150, was 60).
; Far soldiers only get one when the game still draws them in full detail.
Range=150
; At most this many ragdolls at once (1-16). (20g-r6: 12, was 8)
MaxBodies=12
; 1 = log every ragdoll as [ragdoll] lines. 0 = only the 10 s summaries.
Debug=1
; --- live tuning: save this file (or move a slider in the ragdoll lab page) and the game reloads it within about a
; second; the next ragdolls use the new values. F7 = reload now, F8 = slow motion. Keys in the live file
; Documents\BF1GameExt\ragdoll_live.ini win over the ones here. ---
; Muscle tone at death: strength (0 = limp at once) and how long it takes to fade (seconds).
MuscleStrength=0.06
MuscleTime=0.4
; Grip on the ground, and resistance to rolling (0 = rolls like a log).
Friction=0.9
RollingFriction=0.15
; Slowing down through the air (linear) and of spinning / flailing (angular), 0-0.99.
LinearDamping=0.05
AngularDamping=0.85
; Joint looseness: 1 = the ranges of BF1's own animations; below 1 stiffer, above 1 floppier (hips, shoulders,
; neck, waist). Lowering it much makes bodies twitch while they settle.
JointScale=1.0
; Gravity on dead bodies, and on thrown soldiers (the game's thrown arc is ~13.5).
Gravity=9.81
ThrownGravity=13.5
; Thrown soldiers: extra tumble for a full-strength blast (rad/s) and top launch speed (m/s). The game's flying
; animation already tips the body about 60 degrees; at 4.0 the ragdoll flipped right over (about 175).
ThrownSpin=1.0
ThrownMaxSpeed=25
; F8 slow motion speed for ragdolls (0.25 = quarter speed).
SlowMotion=0.25
; How long the body blends from the game's animation into the ragdoll (seconds; 0 = at once).
BlendIn=0.25
; Share of the animation the muscles keep following after MuscleTime (0 = fully limp, 1 = never fades).
AnimKeep=0.1
; Impulse at the hit point when the killing shot hit the body / the head (headshot: half again on the chest).
HitPush=20
HeadshotPunch=35
; Impulse when a bullet hits a body that is already a ragdoll.
CorpseHit=8
; The gun of a dead soldier: 1 = the hand lets go and it falls from wherever the ragdoll's hand is, landing on the
; ground. 2 = the death animation's throw (2-3 m, as the original game). 0 = it stays in the ragdoll's hand.
; Thrown soldiers keep it until the game sets them dead.
WeaponDrop=1
; --- logging ---
; 1 = log knockbacks, damage, thrown and seated soldiers near a player as [hit] / [seat] lines. 0 = off.
HitScan=1
; 1 = the Bullet box-drop test at startup (passed in 15a and 15b).
BulletTest=0
; 1 = the 15b ragdoll scan's logging (skeletons, deaths, bodies). 0 = off.
Scan=0
ScanRange=40
; --- files (read from this file at game start only) ---
; 1 = also read Documents\BF1GameExt\ragdoll_live.ini (the ragdoll lab page writes it); its keys win. 0 = this file only.
LiveFile=1
; 1 = write Documents\BF1GameExt\ragdoll_lab.txt (settings, skeletons, each ragdoll's start) for the lab page. 0 = off.
LabFile=1
; 1 = the death tracker: a [deaths] line in the log for every death and every throw - who, what killed him, a ragdoll
; or exactly why not, drawn in full detail or not - and totals every 60 s. Log only. Read at game start. 0 = off.
DeathTracker=1
; 1 = the ray scan: logs how the game's own world ray test is called (the one bullets, the camera and AI use - it knows
; every platform and floor). Log only; its job is done (17a), so 0 = off by default. Read at game start.
RayScan=0
; 1 = ragdolls on the real floor: the game's own ray test gives the ragdoll its ground - platforms, walkways,
; interiors, ramps, stairs, terrain (Bespin, Cloud City) - and bodies fall off edges. 0 = terrain only (as before 17b).
; Read at game start.
Floors=1
; Metres between the floor rays under a ragdoll (0.25 - 2). Smaller = sharper edges on narrow walkways, more rays.
FloorStep=1.0
; 1 = the wall scan: logs the collision data of the props the floor rays touch (for solid walls next). Log only.
; Read at game start. 0 = off.
WallScan=1
; 1 = walls for ragdolls: rays from the game's own ray test find walls, railings, pillars and ceilings next to a body
; and put solid slabs there, so bodies stop against them. 0 = floors only (as before 17e). Read at game start.
Walls=1
