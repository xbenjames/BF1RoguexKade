name: build dinput8.dll
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release Win32
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          msbuild BF1GameExt.sln /m /p:Configuration=Release /p:Platform=Win32 /v:minimal 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { "failed" | Out-File status.txt } else { "ok" | Out-File status.txt }
          exit 0
      - name: Report
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $status = (Get-Content status.txt -Raw).Trim()
          $sha = "${{ github.sha }}"
          if ($status -eq "ok") {
            $md5 = (Get-FileHash bin\Release\dinput8.dll -Algorithm MD5).Hash.ToLower()
            $size = (Get-Item bin\Release\dinput8.dll).Length
            $warn = (Select-String -Path build.log -Pattern "warning C" | Select-Object -First 40 | ForEach-Object { $_.Line.Trim() }) -join "`n"
            $body = "BUILD OK`ndinput8.dll $size bytes md5 $md5`n`nwarnings (first 40):`n``````n$warn`n``````"
            # publish the DLL on the 'builds' branch (replaced each time)
            New-Item -ItemType Directory -Force pub | Out-Null
            Copy-Item bin\Release\dinput8.dll pub\
            Copy-Item bin\Release\dinput8.pdb pub\ -ErrorAction SilentlyContinue
            "$sha $size $md5" | Out-File pub\build_info.txt
            Copy-Item build.log pub\
            Push-Location pub
            git init -q
            git checkout -q -b builds
            git config user.email "actions@github.com"
            git config user.name "github-actions"
            git add -A
            git commit -q -m "dinput8.dll from $sha"
            git push -f "https://x-access-token:${env:GH_TOKEN}@github.com/${{ github.repository }}.git" builds
            Pop-Location
          } else {
            $errs = (Select-String -Path build.log -Pattern "error|fatal|MSB" | Select-Object -First 60 | ForEach-Object { $_.Line.Trim() }) -join "`n"
            if (-not $errs) { $errs = (Get-Content build.log | Select-Object -Last 60) -join "`n" }
            $body = "BUILD FAILED`n``````n$errs`n``````"
          }
          $tmp = New-TemporaryFile
          $body | Out-File -FilePath $tmp -Encoding utf8
          gh api "repos/${{ github.repository }}/commits/$sha/comments" -F body=@$tmp | Out-Null
          if ($status -ne "ok") { exit 1 }
